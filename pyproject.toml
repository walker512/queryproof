[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryproof"
version = "0.2.0"
description = "Offline reproducible evidence bundles for bounded CSV and SQLite queries"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "walker512"}]
dependencies = []
readme = "README.md"

[project.scripts]
queryproof = "queryproof:main"

[tool.setuptools]
py-modules = ["queryproof"]
