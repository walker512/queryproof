[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryproof"
version = "0.4.0"
description = "Offline reproducible evidence bundles for bounded CSV and SQLite queries"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "walker512"}]
dependencies = []
readme = "README.md"

[project.scripts]
queryproof = "queryproof:main"
queryproof-witness = "queryproof_witness:main"
queryproof-groups = "queryproof_groups:main"
queryproof-check = "queryproof_check:main"

[tool.setuptools]
py-modules = ["queryproof", "queryproof_witness", "queryproof_groups", "queryproof_check"]
